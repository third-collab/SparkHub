<style>
  .user-loading-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); z-index: 10; justify-content: center; align-items: center; border-radius: var(--border-radius-large); flex-direction: column; gap: 10px; }
  #addUserView .form-wrapper, #editUserView .form-wrapper, #readOnlyUserView .form-wrapper { position: relative; min-height: 400px; }
  .user-avatar-placeholder { width: 50px; height: 50px; border-radius: 50%; background: var(--brand-primary); color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin-right: 15px; }
</style>

<div id="user-popup" class="header-popup" style="display:none;">
  <div style="text-align: center; padding: 10px;">
    <h4 id="user-popup-name" style="margin:0;">User</h4>
    <p id="user-popup-role" style="font-size:11px; color:#888; margin:5px 0 15px 0;"></p>
    <div style="border-top: 1px solid #eee; padding-top: 15px; display: flex; flex-direction: column; gap: 8px;">
       <button class="btn-edit" onclick="switchView('readOnlyUserView'); document.getElementById('user-popup').style.display='none';" style="width:100%;">My Access Profile</button>
       <button class="btn-edit" onclick="window.top.location.href='https://accounts.google.com/Logout'" style="width:100%; border-color: #ddd; color: #666;">Sign Out</button>
    </div>
  </div>
</div>

<template class="module-card-template" data-category="core" data-admin-only="true">
  <div class="card" id="card-users" onclick="switchView('usersListView'); loadUsersTable();">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    <h3>Access & Users</h3><p>Manage system access, roles, and directory profiles.</p>
  </div>
</template>

<div id="usersListView" class="container" style="display: none;">
  <button class="btn-dash-back" onclick="switchView('dashboardView')">&#8592; Back to Dashboard</button>
  <div class="view-header-bar" style="margin-bottom: 20px;"><h2>Access Management</h2><button class="btn-primary" onclick="openAddUserForm()">+ Add User</button></div>

  <div class="filter-wrapper">
    <input type="text" id="user-filter-search" class="filter-input" placeholder="Search users..." onkeyup="applyUserFilters()">
    <button class="btn-filter-toggle" onclick="toggleFilter('user-adv')">Filters</button>
    <div id="user-adv" class="filter-advanced">
      <div class="custom-dropdown"><button class="dropdown-btn" onclick="toggleDropdown('user-status-drop')">Status ▼</button>
        <div class="dropdown-content" id="user-status-drop">
          <label><input type="checkbox" class="user-filter-status-cb" value="Active" checked onchange="applyUserFilters()"> Active</label>
          <label><input type="checkbox" class="user-filter-status-cb" value="Inactive" onchange="applyUserFilters()"> Inactive</label>
        </div>
      </div>
      <div class="custom-dropdown"><button class="dropdown-btn" onclick="toggleDropdown('user-role-drop')">Role ▼</button>
        <div class="dropdown-content" id="user-role-drop">
          <label><input type="checkbox" class="user-filter-role-cb" value="Admin" checked onchange="applyUserFilters()"> Admin</label>
          <label><input type="checkbox" class="user-filter-role-cb" value="Account Manager" checked onchange="applyUserFilters()"> Account Manager</label>
          <label><input type="checkbox" class="user-filter-role-cb" value="Account Support" checked onchange="applyUserFilters()"> Account Support</label>
        </div>
      </div>
      <button type="button" class="btn-reset-filters" onclick="resetUserFilters()">Reset</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="sortable" onclick="handleUserSort('username')">Username <span id="usort-username" class="sort-icon"></span></th>
          <th class="sortable" onclick="handleUserSort('firstName')">Name <span id="usort-firstName" class="sort-icon"></span></th>
          <th>System Email</th><th>Role</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="userTableBody"><tr><td colspan="6" style="text-align:center; padding: 30px;">Loading users...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="addUserView" class="container" style="display: none;">
  <button class="btn-dash-back" onclick="switchView('usersListView')">&#8592; Back to Directory</button>
  <div class="form-wrapper">
    <div id="add-user-overlay" class="user-loading-overlay"><div class="spinner-core"></div><span>Creating User Profile...</span></div>
    <h2 style="margin-top: 0; color: var(--brand-dark); border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 25px;">Add System User</h2>
    <form id="addUserForm" onsubmit="handleAddUserSubmit(event)" novalidate>
      <div class="form-row">
        <div class="form-group"><label>First Name *</label><input type="text" id="add-user-first" class="form-control" required></div>
        <div class="form-group"><label>Last Name *</label><input type="text" id="add-user-last" class="form-control" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Username (Login ID) *</label><input type="text" id="add-user-username" class="form-control" required></div>
        <div class="form-group"><label>Google Account Email *</label><input type="email" id="add-user-email" class="form-control" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>System Role *</label>
          <select id="add-user-role" class="form-control" required>
            <option value="Admin">Admin</option>
            <option value="Account Manager">Account Manager</option>
            <option value="Account Support">Account Support</option>
          </select>
        </div>
        <div class="form-group"><label>Access Status</label>
          <select id="add-user-status" class="form-control">
            <option value="Active" selected>Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Local Password</label><input type="password" id="add-user-password" class="form-control" placeholder="Leave blank if using Google SSO"></div>
      </div>
      <div class="action-buttons" style="display: flex; justify-content: flex-end; margin-top: 30px;">
        <button type="submit" class="btn-primary" id="add-user-submit">Create User</button>
      </div>
    </form>
    <div id="add-user-status" class="status-msg"></div>
  </div>
</div>

<div id="editUserView" class="container" style="display: none;">
  <button class="btn-dash-back" onclick="switchView('usersListView')">&#8592; Back to Directory</button>
  <div class="form-wrapper">
    <div id="edit-user-overlay" class="user-loading-overlay"><div class="spinner-core"></div><span id="edit-user-overlay-txt">Loading User Data...</span></div>
    <h2 style="margin-top: 0; color: var(--brand-dark); border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 25px;">Edit User Access</h2>
    <form id="editUserForm" onsubmit="handleEditUserSubmit(event)" novalidate>
      <input type="hidden" id="edt-user-rowIndex">
      <div class="form-row">
        <div class="form-group"><label>First Name *</label><input type="text" id="edt-user-first" class="form-control" required></div>
        <div class="form-group"><label>Last Name *</label><input type="text" id="edt-user-last" class="form-control" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Username (Login ID) *</label><input type="text" id="edt-user-username" class="form-control" required></div>
        <div class="form-group"><label>Google Account Email *</label><input type="email" id="edt-user-email" class="form-control" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>System Role *</label>
          <select id="edt-user-role" class="form-control" required>
            <option value="Admin">Admin</option>
            <option value="Account Manager">Account Manager</option>
            <option value="Account Support">Account Support</option>
          </select>
        </div>
        <div class="form-group"><label>Access Status</label>
          <select id="edt-user-status" class="form-control">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Local Password</label><input type="password" id="edt-user-password" class="form-control" placeholder="Leave blank to keep current, or enter new"></div>
      </div>
      <div class="action-buttons" style="display: flex; justify-content: flex-end; margin-top: 30px;">
        <button type="submit" class="btn-primary" id="edt-user-submit">Update Access</button>
      </div>
    </form>
    <div id="edt-user-status" class="status-msg"></div>
  </div>
</div>

<div id="readOnlyUserView" class="container" style="display: none;">
  <button class="btn-dash-back" onclick="switchView('usersListView')">&#8592; Back to Directory</button>
  <div class="form-wrapper">
    <div id="ro-user-overlay" class="user-loading-overlay"><div class="spinner-core"></div><span>Loading Profile...</span></div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #E3E3E3; padding-bottom: 20px;">
       <div style="display: flex; align-items: center;">
          <div class="user-avatar-placeholder" id="ro-user-initial">U</div>
          <div>
            <h2 id="ro-user-fullname" style="margin:0;"></h2>
            <p id="ro-user-subline" style="margin: 5px 0 0 0; color: #666; font-size: 15px;"></p>
            <div id="ro-user-status-pill" style="margin-top: 5px;"></div>
          </div>
       </div>
       <button id="ro-user-edit-btn" class="btn-edit" style="padding: 10px 20px;">Edit Access</button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px;">
      <div>
        <h4 style="color:var(--brand-primary); border-bottom:1px solid #eee; padding-bottom:5px;">System Profile</h4>
        <p><strong>Username:</strong> <span id="ro-user-username"></span></p>
        <p><strong>System Role:</strong> <span id="ro-user-role"></span></p>
      </div>
      <div>
        <h4 style="color:var(--brand-primary); border-bottom:1px solid #eee; padding-bottom:5px;">Authentication</h4>
        <p><strong>Google Login Email:</strong> <span id="ro-user-email"></span></p>
        <p><strong>Last Login:</strong> <span id="ro-user-lastlogin" style="color: #64748b;"></span></p>
      </div>
    </div>
  </div>
</div>

<script>
  var GLOBAL_USER_DATA = [];
  var CURRENT_USER_SORT_COLUMN = 'username';
  var CURRENT_USER_SORT_DESC = false;

  function initUserBarPlugin() {
    if (INSTALLED_PLUGINS.includes('UserBar')) {
      var nameEl = document.getElementById('display-username');
      if (nameEl) nameEl.innerText = CURRENT_USERNAME;
      var popName = document.getElementById('user-popup-name');
      if (popName) popName.innerText = CURRENT_USERNAME;
      var popRole = document.getElementById('user-popup-role');
      if (popRole) popRole.innerText = CURRENT_USER_ROLE;
    }
  }

  function loadUsersTable() {
    google.script.run.withSuccessHandler(function(users) {
      GLOBAL_USER_DATA = users || [];
      applyUserFilters();
    }).getUsersList();
  }

  function handleUserSort(column) {
    if (CURRENT_USER_SORT_COLUMN === column) { CURRENT_USER_SORT_DESC = !CURRENT_USER_SORT_DESC; } 
    else { CURRENT_USER_SORT_COLUMN = column; CURRENT_USER_SORT_DESC = false; }
    applyUserFilters();
  }

  function resetUserFilters() {
    document.getElementById('user-filter-search').value = '';
    document.querySelectorAll('.user-filter-status-cb').forEach(cb => cb.checked = (cb.value === 'Active'));
    document.querySelectorAll('.user-filter-role-cb').forEach(cb => cb.checked = true);
    applyUserFilters();
  }

  function applyUserFilters() {
    var search = document.getElementById('user-filter-search').value.toLowerCase();
    var checkedStatuses = Array.from(document.querySelectorAll('.user-filter-status-cb:checked')).map(cb => cb.value);
    var checkedRoles = Array.from(document.querySelectorAll('.user-filter-role-cb:checked')).map(cb => cb.value);

    var filtered = GLOBAL_USER_DATA.filter(function(u) {
      var name = (u.firstName + " " + u.lastName).toLowerCase();
      var matchesSearch = u.username.toLowerCase().includes(search) || name.includes(search) || u.email.toLowerCase().includes(search);
      var matchesStatus = checkedStatuses.length === 0 || checkedStatuses.includes(u.status);
      var matchesRole = checkedRoles.length === 0 || checkedRoles.includes(u.role);
      return matchesSearch && matchesStatus && matchesRole;
    });

    filtered.sort(function(a, b) {
      var valA = String(a[CURRENT_USER_SORT_COLUMN] || "").toLowerCase();
      var valB = String(b[CURRENT_USER_SORT_COLUMN] || "").toLowerCase();
      if (valA < valB) return CURRENT_USER_SORT_DESC ? 1 : -1;
      if (valA > valB) return CURRENT_USER_SORT_DESC ? -1 : 1;
      return 0;
    });

    document.querySelectorAll('.sort-icon').forEach(icon => { if(icon.id.startsWith('usort-')) icon.innerHTML = ''; });
    var iconEl = document.getElementById('usort-' + CURRENT_USER_SORT_COLUMN);
    if (iconEl) iconEl.innerHTML = CURRENT_USER_SORT_DESC ? '▼' : '▲';

    renderUserTableRows(filtered);
  }

  function renderUserTableRows(users) {
    var tbody = document.getElementById('userTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    if (users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px;">No users match your criteria.</td></tr>';
      return;
    }
    users.forEach(function(u) {
      var tr = document.createElement('tr');
      tr.style.cursor = "pointer";
      tr.onclick = function(e) { if (!e.target.closest('.btn-edit')) openReadOnlyUser(u.rowIndex); };
      
      var badgeClass = "badge badge-" + (u.status || "").toLowerCase();
      tr.innerHTML = `
        <td><strong>${u.username}</strong></td>
        <td>${u.firstName} ${u.lastName}</td>
        <td>${u.email}</td>
        <td>${u.role}</td>
        <td><span class="${badgeClass}">${u.status || "-"}</span></td>
        <td><button class="btn-edit" onclick="openEditUserForm(${u.rowIndex}); event.stopPropagation();">Edit</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleUserOverlay(id, show, text) {
    var overlay = document.getElementById(id);
    if (!overlay) return;
    overlay.style.display = show ? 'flex' : 'none';
    if (text) { var txtEl = overlay.querySelector('span'); if (txtEl) txtEl.innerText = text; }
  }

  function openAddUserForm() {
    document.getElementById('addUserForm').reset();
    document.getElementById('add-user-status').innerHTML = '';
    toggleUserOverlay('add-user-overlay', false);
    switchView('addUserView');
  }

  function handleAddUserSubmit(e) {
    if(e) e.preventDefault();
    var username = document.getElementById('add-user-username').value;
    if (!username) return;

    toggleUserOverlay('add-user-overlay', true, 'Creating Profile...');
    var statusEl = document.getElementById('add-user-status');
    var btn = document.getElementById('add-user-submit');
    btn.disabled = true;

    var userData = {
      username: username, role: document.getElementById('add-user-role').value,
      email: document.getElementById('add-user-email').value, password: document.getElementById('add-user-password').value,
      firstName: document.getElementById('add-user-first').value,
      lastName: document.getElementById('add-user-last').value, status: document.getElementById('add-user-status').value
    };

    google.script.run.withSuccessHandler(function(res) {
      toggleUserOverlay('add-user-overlay', false);
      statusEl.innerHTML = res;
      if (res.includes("Success")) {
        statusEl.style.color = "green";
        setTimeout(() => { loadUsersTable(); switchView('usersListView'); }, 1500);
      } else { btn.disabled = false; }
    }).processNewUser(userData);
  }

  function openEditUserForm(rowIndex) {
    switchView('editUserView');
    document.getElementById('editUserForm').reset();
    document.getElementById('edt-user-status').innerHTML = '';
    toggleUserOverlay('edit-user-overlay', true, 'Fetching Data...');

    google.script.run.withSuccessHandler(function(data) {
      toggleUserOverlay('edit-user-overlay', false);
      document.getElementById('edt-user-rowIndex').value = data.rowIndex;
      document.getElementById('edt-user-username').value = data.username || "";
      document.getElementById('edt-user-role').value = data.role || "Account Manager";
      document.getElementById('edt-user-email').value = data.email || "";
      document.getElementById('edt-user-password').value = data.password || "";
      document.getElementById('edt-user-first').value = data.firstName || "";
      document.getElementById('edt-user-last').value = data.lastName || "";
      document.getElementById('edt-user-status').value = data.status || "Active";
    }).getUserById(rowIndex);
  }

  function handleEditUserSubmit(e) {
    if(e) e.preventDefault();
    toggleUserOverlay('edit-user-overlay', true, 'Saving Changes...');
    var btn = document.getElementById('edt-user-submit');
    btn.disabled = true;

    var userData = {
      rowIndex: document.getElementById('edt-user-rowIndex').value,
      username: document.getElementById('edt-user-username').value,
      role: document.getElementById('edt-user-role').value,
      email: document.getElementById('edt-user-email').value,
      password: document.getElementById('edt-user-password').value,
      firstName: document.getElementById('edt-user-first').value,
      lastName: document.getElementById('edt-user-last').value,
      status: document.getElementById('edt-user-status').value
    };

    google.script.run.withSuccessHandler(function(res) {
      toggleUserOverlay('edit-user-overlay', false);
      if (res.includes("Success")) {
        loadUsersTable(); openReadOnlyUser(userData.rowIndex);
      } else { btn.disabled = false; }
    }).updateUserRecord(userData);
  }

  function openReadOnlyUser(rowIndex) {
    switchView('readOnlyUserView');
    document.getElementById('ro-user-fullname').innerText = "";
    document.getElementById('ro-user-email').innerText = "";
    document.getElementById('ro-user-initial').innerText = "";
    
    toggleUserOverlay('ro-user-overlay', true, 'Loading Profile...');

    google.script.run.withSuccessHandler(function(data) {
      toggleUserOverlay('ro-user-overlay', false);
      document.getElementById('ro-user-fullname').innerText = data.firstName + " " + data.lastName;
      document.getElementById('ro-user-subline').innerText = data.role;
      document.getElementById('ro-user-initial').innerText = data.firstName ? data.firstName.charAt(0).toUpperCase() : "U";
      
      var statusBox = document.getElementById('ro-user-status-pill');
      var sClass = data.status === 'Active' ? 'badge-active' : 'badge-inactive';
      statusBox.innerHTML = `<span class="badge ${sClass}">${data.status}</span>`;

      document.getElementById('ro-user-username').innerText = data.username;
      document.getElementById('ro-user-role').innerText = data.role;
      document.getElementById('ro-user-email').innerText = data.email;
      document.getElementById('ro-user-lastlogin').innerText = data.lastLogin || "Never logged in";

      document.getElementById('ro-user-edit-btn').onclick = function() { openEditUserForm(data.rowIndex); };
    }).getUserById(rowIndex);
  }
</script>
