<style>
  .client-loading-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); z-index: 2000; justify-content: center; align-items: center; border-radius: 8px; flex-direction: column; gap: 15px; backdrop-filter: blur(2px); }
  .dynamic-json-row { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 15px; position: relative; }
  .row-remove-btn { position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #ef4444; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-weight: bold; }
  .ql-container.ql-snow { border: 1px solid #cbd5e1 !important; border-radius: 0 0 6px 6px; background:#fff; min-height: 120px;}
  .ql-toolbar.ql-snow { border: 1px solid #cbd5e1 !important; border-radius: 6px 6px 0 0; background: #f8fafc; }
  .accordion-grp-row { display:flex; gap:15px; align-items:center; background:#fff; border:1px solid #e2e8f0; padding:15px; border-radius:8px; margin-bottom:10px; }
</style>

<template class="module-card-template" data-category="operational" data-perm-category="Clients" data-perm-action="View Clients">
  <div class="card" id="card-clients" onclick="initClientsModule();">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
    <h3>Clients & Services</h3><p>Manage brands and onboarding workflows.</p>
  </div>
</template>

<template id="tpl-settings-clients-ro">
  <div style="margin-top: 25px;">
    <h4 class="settings-section-header">Client Configuration</h4>
    <div id="ro-clients-core-config" style="background:#fff; padding:20px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom: 20px;"></div>
    <h4 class="settings-section-header">Form Accordions</h4>
    <div id="ro-clients-accordions" style="background:#f8fafc; padding:20px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom: 20px;"></div>
    <h4 class="settings-section-header">Custom Fields</h4>
    <div id="ro-clients-fields" style="background:#f8fafc; padding:20px; border-radius:8px; border:1px solid #e2e8f0;"></div>
  </div>
</template>

<template id="tpl-settings-clients-edt">
  <div style="margin-top: 25px;">
    <h3 class="settings-section-header" style="border-left:4px solid var(--brand-primary); padding-left:15px;">Clients Module Configuration</h3>
    <div class="form-group" style="background:#f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 30px;">
      <label>Auto-Provision User Role</label>
      <select id="edt-client-role-select" class="form-control" style="max-width: 400px;"></select>
    </div>
    
    <h4 class="settings-section-header">Form Accordion Groups</h4>
    <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Define the logical sections of your client onboarding forms. Default groups cannot be removed.</p>
    <div id="edt-accordions-container" style="margin-bottom:20px;"></div>
    <button type="button" class="btn-add-row" onclick="addAccordionGroupRow()">+ Add Accordion Group</button>

    <h4 class="settings-section-header" style="margin-top:40px;">Dynamic Custom Fields</h4>
    <div id="edt-clients-custom-fields-container" style="display:flex; flex-direction:column; gap:15px; margin-bottom:20px;"></div>
    <button type="button" class="btn-add-row" onclick="addClientCustomFieldRow()">+ Add Custom Field</button>
    
    <div style="margin-top: 40px; text-align: right; border-top: 1px solid #e2e8f0; padding-top: 20px;">
      <button type="button" class="btn-primary" onclick="handleSaveClientsConfig(event)" style="padding: 12px 30px;">Save Configuration</button>
    </div>
  </div>
</template>

<div id="clientListView" class="container" style="display: none;">
  <div class="view-header-bar" style="margin-bottom: 20px;"><h2 style="margin: 0; color: var(--brand-dark);">Clients Master Registry</h2></div>
  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px;">
    <div class="tab-nav" style="margin: 0; border: none;">
      <button type="button" class="tab-btn active" id="btn-tab-brands" onclick="switchClientMasterTab('brands')">Brand Directory</button>
      <button type="button" class="tab-btn perm-protected" id="btn-tab-services" data-perm-category="Clients" data-perm-action="Manage Services" onclick="switchClientMasterTab('services')">Service Definitions</button>
    </div>
    <div id="client-action-btns">
      <button class="btn-primary perm-protected" onclick="openDynamicForm('add')" data-perm-category="Clients" data-perm-action="Onboard Clients">+ Onboard New Client</button>
    </div>
  </div>
  <div id="cm-tab-brands" style="display:block;">
    <div class="filter-wrapper"><input type="text" id="client-filter-search" class="filter-input" placeholder="Search..." onkeyup="applyClientFilters()"></div>
    <div class="table-container">
      <table>
        <thead><tr><th>Brand</th><th>Primary Contact</th><th>Account Manager</th><th>Status</th><th style="text-align:right;">Action</th></tr></thead>
        <tbody id="clientTableBody"></tbody>
      </table>
    </div>
  </div>
  <div id="cm-tab-services" style="display:none;">
    <div class="table-container">
      <table>
        <thead><tr><th>Service Name</th><th>Description</th><th>Status</th><th style="text-align:right;">Action</th></tr></thead>
        <tbody id="servicesTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="dynamicClientFormView" class="container" style="display: none;">
  <button class="btn-dash-back" onclick="switchView('clientListView')">&#8592; Back to Registry</button>
  <div class="form-wrapper">
    <div id="dyn-client-overlay" class="client-loading-overlay"><div class="spinner-client"></div><span id="dyn-overlay-text">Loading...</span></div>
    <h2 id="dyn-form-title" style="margin-top: 0; color: var(--brand-dark);">Onboard Client</h2>
    <form id="dynamicClientForm" onsubmit="handleDynamicSubmit(event)" novalidate>
      <input type="hidden" id="dyn-mode"><input type="hidden" id="dyn-rowIndex">
      <div id="dyn-accordions-render-target"></div>
      <div class="action-buttons" style="display: flex; justify-content: flex-end; margin-top: 40px; gap:20px;">
        <button type="button" class="btn-reset-filters" onclick="switchView('clientListView')" style="padding: 12px 30px;">Cancel</button>
        <button type="submit" class="btn-primary" id="dyn-submit-btn" style="padding: 12px 50px;">Save Profile</button>
      </div>
    </form>
  </div>
</div>

<div id="serviceFormView" class="container" style="display: none;">
  <button class="btn-dash-back" onclick="switchView('clientListView'); switchClientMasterTab('services');">&#8592; Back to Registry</button>
  <div class="form-wrapper">
    <h2 id="srvFormTitle">Define Service</h2>
    <form id="srvForm" onsubmit="handleServiceSubmit(event)">
      <input type="hidden" id="srv-rowIndex">
      <div class="form-row" style="margin-top:25px;"><div class="form-group"><label>Service Name *</label><input type="text" id="srv-name" class="form-control" required></div><div class="form-group"><label>Status</label><select id="srv-status" class="form-control"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div></div>
      <div class="form-group"><label>Description</label><textarea id="srv-desc" class="form-control" style="height: 120px;"></textarea></div>
      <div style="display: flex; justify-content: flex-end; margin-top: 40px;"><button type="submit" class="btn-primary" id="srv-save-btn">Save Service</button></div>
    </form>
  </div>
</div>

<script>
  var GLOBAL_CLIENTS_DATA = []; var CLIENTS_CONFIG = { accordionGroups: [], customFields: [] }; var GLOBAL_SERVICES = []; var ACTIVE_QUILLS = {};

  (function fetchClientConfigEagerly() {
     google.script.run.withSuccessHandler(res => { if(res.success) CLIENTS_CONFIG = res.data; }).getClientsModuleConfig();
  })();

  document.addEventListener('click', function(e) {
     if (e.target && e.target.id === 'btn-set-ro-clients') renderRoClientsConfig();
     if (e.target && e.target.id === 'btn-set-edt-clients') renderEdtClientsConfig();
  });

  function initClientsModule() { switchView('clientListView'); loadClientsTable(); loadServicesTable(); }

  function switchClientMasterTab(tab) {
    var bV=document.getElementById('cm-tab-brands'), sV=document.getElementById('cm-tab-services'), act=document.getElementById('client-action-btns');
    document.querySelectorAll('#clientListView .tab-btn').forEach(b => b.classList.remove('active'));
    if (tab === 'brands') { bV.style.display='block'; sV.style.display='none'; document.getElementById('btn-tab-brands').classList.add('active'); act.innerHTML = `<button class="btn-primary perm-protected" onclick="openDynamicForm('add')" data-perm-category="Clients" data-perm-action="Onboard Clients">+ Onboard New Client</button>`; } 
    else { bV.style.display='none'; sV.style.display='block'; document.getElementById('btn-tab-services').classList.add('active'); act.innerHTML = `<button class="btn-primary perm-protected" onclick="openServiceForm()" data-perm-category="Clients" data-perm-action="Manage Services">+ Define New Service</button>`; loadServicesTable(); }
    if (typeof enforceUIPermissions === 'function') enforceUIPermissions();
  }

  function loadClientsTable() { google.script.run.withSuccessHandler(res => { GLOBAL_CLIENTS_DATA = res.data || []; applyClientFilters(); }).getClientsList(); }
  function applyClientFilters() {
    var s=document.getElementById('client-filter-search').value.toLowerCase(); var t=document.getElementById('clientTableBody'); t.innerHTML='';
    var f=GLOBAL_CLIENTS_DATA.filter(c => c.brandName.toLowerCase().includes(s));
    f.forEach(c => t.innerHTML += `<tr style="cursor:pointer;" onclick="openDynamicForm('edit', ${c.rowIndex})"><td><strong>${c.brandName}</strong></td><td>${c.pFirstName} ${c.pLastName}</td><td><span class="badge" style="background:#f1f5f9; color:#475569;">${c.acctMgr}</span></td><td><span class="badge badge-${(c.status).toLowerCase()}">${c.status}</span></td><td style="text-align:right;"><button class="btn-edit" onclick="openDynamicForm('edit', ${c.rowIndex}); event.stopPropagation();">Edit</button></td></tr>`);
  }
  function loadServicesTable() { google.script.run.withSuccessHandler(res => { GLOBAL_SERVICES = res.data || []; document.getElementById('servicesTableBody').innerHTML = GLOBAL_SERVICES.map(s => `<tr><td><strong>${s.name}</strong></td><td>${s.description}</td><td>${s.status}</td><td style="text-align:right;"><button class="btn-edit" onclick="openServiceForm(${s.rowIndex})">Edit</button></td></tr>`).join(''); }).getServicesList(); }

  /* SETTINGS RENDERERS */
  function renderRoClientsConfig() {
     document.getElementById('ro-clients-core-config').innerHTML = `<p style="margin:0;"><strong>Default Role Provisioned to Clients:</strong> <span class="badge" style="background:var(--brand-primary); color:#fff; font-size:13px; padding:5px 12px; margin-left: 10px;">${CLIENTS_CONFIG.clientRole || "Client"}</span></p>`;
     document.getElementById('ro-clients-accordions').innerHTML = CLIENTS_CONFIG.accordionGroups.map(g => `<span class="badge" style="margin-right:10px; margin-bottom: 10px; display:inline-block; background:${g.isDefault?'#dbeafe':'#f1f5f9'}; color:${g.isDefault?'#1e40af':'#475569'}; border: 1px solid ${g.isDefault?'#bfdbfe':'#e2e8f0'}; padding: 8px 15px; font-size: 13px;">${g.label} ${g.isDefault?'<span style="opacity:0.6; font-size:11px; margin-left:5px;">(Default)</span>':''}</span>`).join('');
     var fldsList = document.getElementById('ro-clients-fields');
     if (CLIENTS_CONFIG.customFields.length === 0) fldsList.innerHTML = '<p style="color:#94a3b8; font-style:italic; margin:0;">No custom fields configured.</p>';
     else {
         fldsList.innerHTML = '<table class="history-diff-table" style="margin-top:0;"><thead><tr><th>Field Label</th><th>Type</th><th>Group Assignment</th></tr></thead><tbody>' + CLIENTS_CONFIG.customFields.map(f => {
             var grp = CLIENTS_CONFIG.accordionGroups.find(g => g.id === f.groupId); return `<tr><td><strong>${f.label}</strong></td><td><span class="badge" style="background:#e2e8f0; color:#475569;">${f.type}</span></td><td>${grp?grp.label:'Unassigned'}</td></tr>`;
         }).join('') + '</tbody></table>';
     }
  }

  function renderEdtClientsConfig() {
     google.script.run.withSuccessHandler(res => { document.getElementById('edt-client-role-select').innerHTML = (res.data || []).map(r => `<option value="${r.roleName}" ${r.roleName === CLIENTS_CONFIG.clientRole ? 'selected' : ''}>${r.roleName}</option>`).join(''); }).getRolesList();
     var accContainer = document.getElementById('edt-accordions-container'); accContainer.innerHTML = '';
     CLIENTS_CONFIG.accordionGroups.forEach(g => addAccordionGroupRow(g));
     var fldContainer = document.getElementById('edt-clients-custom-fields-container'); fldContainer.innerHTML = '';
     CLIENTS_CONFIG.customFields.forEach(f => addClientCustomFieldRow(f));
  }

  function addAccordionGroupRow(data = { id: 'grp_'+Math.random().toString(36).substr(2,9), label: '', isDefault: false }) {
     var c = document.getElementById('edt-accordions-container'); var row = document.createElement('div'); 
     row.className = 'accordion-grp-row'; row.style.alignItems = 'flex-end'; row.dataset.id = data.id; row.dataset.def = data.isDefault;
     var html = `<div style="flex:1;"><label style="display:block; font-size:13px; font-weight:bold; color:#475569; margin-bottom:8px;">Group Label ${data.isDefault?'<span style="color:#3b82f6; font-weight:normal; margin-left:5px;">(System Default)</span>':''}</label><input type="text" class="acc-label form-control" value="${data.label}" oninput="refreshCustomFieldGroupDropdowns()" ${data.isDefault ? 'readonly style="background:#f1f5f9; cursor:not-allowed;"' : ''}></div>`;
     if(!data.isDefault) html += `<div style="padding-bottom: 2px;"><button type="button" class="btn-reset-filters" onclick="this.parentElement.parentElement.remove(); refreshCustomFieldGroupDropdowns();" style="color:#ef4444; border-color:#fee2e2; background:#fff; padding: 10px 20px;">Remove</button></div>`;
     row.innerHTML = html; c.appendChild(row); setTimeout(refreshCustomFieldGroupDropdowns, 100);
  }

  function addClientCustomFieldRow(data = {}) {
     var c = document.getElementById('edt-clients-custom-fields-container'); var row = document.createElement('div'); row.className = 'dynamic-json-row cf-row';
     var typeOpts = ['text', 'number', 'date', 'checkbox', 'select', 'textarea', 'richtext', 'json'].map(t => `<option value="${t}" ${data.type===t?'selected':''}>${t}</option>`).join('');
     var optsDisplay = data.type==='select' ? 'block' : 'none'; var jsonDisplay = data.type==='json' ? 'block' : 'none';
     
     row.innerHTML = `<button type="button" class="row-remove-btn" onclick="this.parentElement.remove()">&times;</button>
     <div style="display:grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr; gap:12px; align-items:end;">
         <div class="form-group"><label>Field Label</label><input type="text" class="cf-label form-control" value="${data.label || ''}" onchange="this.parentElement.nextElementSibling.querySelector('.cf-id').value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '_')"></div>
         <div class="form-group"><label>Unique ID</label><input type="text" class="cf-id form-control" value="${data.id || ''}" readonly style="background:#f1f5f9;"></div>
         <div class="form-group"><label>Field Type</label><select class="cf-type form-control" onchange="toggleCfOpts(this)">${typeOpts}</select></div>
         <div class="form-group"><label>Required</label><select class="cf-req form-control"><option value="false">No</option><option value="true" ${data.required?'selected':''}>Yes</option></select></div>
         <div class="form-group"><label>Assign to Group</label><select class="cf-grp form-control" data-selected="${data.groupId||''}"></select></div>
     </div>
     <div class="form-group cf-opts-grp" style="margin-top:10px; display:${optsDisplay};"><label class="cf-opts-lbl">Dropdown Options (Comma separated)</label><input type="text" class="cf-opts form-control" value="${data.type==='select'?(data.options||''):''}"></div>
     <div class="form-group cf-json-grp" style="margin-top:15px; display:${jsonDisplay}; border:1px dashed #cbd5e1; padding:15px; border-radius:8px; background:#fff;">
         <label style="color:var(--brand-primary); font-weight:bold; margin-bottom:10px; display:block;">JSON Sub-Field Definitions</label>
         <div class="json-subfields-container" style="display:flex; flex-direction:column; gap:10px; margin-bottom:10px;"></div>
         <button type="button" class="btn-add-row" onclick="addJsonSubfieldRow(this.previousElementSibling)" style="font-size:12px; padding:6px 15px;">+ Add Sub-Field</button>
     </div>`;
     c.appendChild(row); refreshCustomFieldGroupDropdowns();

     if (data.type === 'json' && data.options) { try { JSON.parse(data.options).forEach(s => addJsonSubfieldRow(row.querySelector('.json-subfields-container'), s)); } catch(e) {} }
  }

  function toggleCfOpts(sel) {
     var row = sel.closest('.cf-row'); var optGrp = row.querySelector('.cf-opts-grp'); var jsonGrp = row.querySelector('.cf-json-grp');
     if (sel.value === 'select') { optGrp.style.display = 'block'; jsonGrp.style.display = 'none'; } 
     else if (sel.value === 'json') { optGrp.style.display = 'none'; jsonGrp.style.display = 'block'; var c = jsonGrp.querySelector('.json-subfields-container'); if (c.children.length === 0) addJsonSubfieldRow(c); } 
     else { optGrp.style.display = 'none'; jsonGrp.style.display = 'none'; }
  }

  function addJsonSubfieldRow(container, data = {label:'', type:'text', options:''}) {
      var row = document.createElement('div'); row.className = 'json-sf-row'; row.style.display = 'flex'; row.style.gap = '10px'; row.style.alignItems = 'flex-end'; row.style.background = '#f8fafc'; row.style.padding = '10px'; row.style.borderRadius = '6px'; row.style.border = '1px solid #e2e8f0';
      var types = ['text', 'number', 'date', 'checkbox', 'select', 'textarea'].map(t => `<option value="${t}" ${data.type===t?'selected':''}>${t}</option>`).join('');
      row.innerHTML = `
          <div style="flex:2;"><label style="font-size:11px;">Sub-Field Label</label><input type="text" class="sf-label form-control" style="font-size:13px; padding:6px;" value="${data.label}"></div>
          <div style="flex:1;"><label style="font-size:11px;">Type</label><select class="sf-type form-control" style="font-size:13px; padding:6px;" onchange="this.parentElement.nextElementSibling.style.display = this.value==='select'?'block':'none'">${types}</select></div>
          <div style="flex:2; display:${data.type==='select'?'block':'none'};"><label style="font-size:11px;">Dropdown Options</label><input type="text" class="sf-opts form-control" style="font-size:13px; padding:6px;" value="${data.options||''}"></div>
          <button type="button" onclick="this.parentElement.remove()" style="background:none; border:none; color:#ef4444; cursor:pointer; padding:6px; font-weight:bold; font-size:18px;">&times;</button>
      `;
      container.appendChild(row);
  }

  function refreshCustomFieldGroupDropdowns() {
     var opts = Array.from(document.querySelectorAll('.accordion-grp-row')).map(r => `<option value="${r.dataset.id}">${r.querySelector('.acc-label').value}</option>`).join('');
     document.querySelectorAll('.cf-grp').forEach(sel => { var val = sel.value || sel.dataset.selected; sel.innerHTML = opts; if(val) sel.value = val; });
  }

  function handleSaveClientsConfig(e) {
     var accs = Array.from(document.querySelectorAll('.accordion-grp-row')).map(r => ({ id: r.dataset.id, label: r.querySelector('.acc-label').value, isDefault: r.dataset.def==='true' }));
     var flds = Array.from(document.querySelectorAll('.cf-row')).map(r => {
         var type = r.querySelector('.cf-type').value; var optionsStr = '';
         if (type === 'select') optionsStr = r.querySelector('.cf-opts').value;
         else if (type === 'json') {
             var sfs = Array.from(r.querySelectorAll('.json-sf-row')).map(sr => ({ label: sr.querySelector('.sf-label').value, type: sr.querySelector('.sf-type').value, options: sr.querySelector('.sf-opts').value })).filter(sf => sf.label.trim() !== '');
             optionsStr = JSON.stringify(sfs);
         }
         return { label: r.querySelector('.cf-label').value, id: r.querySelector('.cf-id').value, type: type, required: r.querySelector('.cf-req').value==='true', groupId: r.querySelector('.cf-grp').value, options: optionsStr };
     });
     var payload = { clientRole: document.getElementById('edt-client-role-select').value, accordionGroups: accs, customFields: flds };
     var btn = e.target; btn.innerText = "Saving..."; btn.disabled = true;
     google.script.run.withSuccessHandler(res => { btn.innerText = "Save Configuration"; btn.disabled = false; if(res.success) { CLIENTS_CONFIG = payload; if(typeof showSystemModal === 'function') showSystemModal("Saved", "Config updated."); else alert("Saved!"); } }).saveClientsModuleConfig(payload);
  }

  // Handle the logic for disabling Term Count when "One-time" is selected
  function handleTermUnitChange(el) {
      var tc = document.getElementById('dyn-core-termCount');
      if (el.value === 'One-time') { tc.value = '1'; tc.readOnly = true; tc.style.background = '#f1f5f9'; } 
      else { tc.readOnly = false; tc.style.background = '#fff'; }
  }

  /* DYNAMIC FORM BUILDER */
  function openDynamicForm(mode, rowIndex = null) {
      document.getElementById('dynamicClientForm').reset(); ACTIVE_QUILLS = {};
      document.getElementById('dyn-mode').value = mode; document.getElementById('dyn-rowIndex').value = rowIndex || '';
      document.getElementById('dyn-form-title').innerText = mode === 'add' ? "Onboard Client" : "Edit Profile";
      switchView('dynamicClientFormView');
      if (mode === 'edit') {
          document.getElementById('dyn-client-overlay').style.display = 'flex';
          google.script.run.withSuccessHandler(res => { document.getElementById('dyn-client-overlay').style.display = 'none'; buildDynamicForm(mode, res.data); }).getClientById(rowIndex);
      } else { buildDynamicForm(mode, {}); }
  }

  function buildDynamicForm(mode, data) {
      var target = document.getElementById('dyn-accordions-render-target'); target.innerHTML = '';
      var addl = {}; try { addl = JSON.parse(data.addlFields || "{}"); } catch(e){}
      var srvArr = (data.services || "").split(',').map(s=>s.trim());
      
      CLIENTS_CONFIG.accordionGroups.forEach((grp, idx) => {
          var html = `<button type="button" class="accordion ${idx===0?'active':''}" onclick="toggleAccordion(this)">${grp.label}</button><div class="panel" style="display: ${idx===0?'block':'none'}; padding-top:15px;">`;
          
          if (grp.id === 'grp_client') {
              html += `<div class="form-row"><div class="form-group"><label>Company Name *</label><input type="text" id="dyn-core-companyName" class="form-control dyn-core" value="${data.companyName||''}" required></div><div class="form-group"><label>Status</label><select id="dyn-core-status" class="form-control dyn-core"><option value="Onboarding" ${data.status==='Onboarding'?'selected':''}>Onboarding</option><option value="Active" ${data.status==='Active'?'selected':''}>Active</option></select></div></div>`;
              html += `<div class="form-group"><label>Address</label><input type="text" id="dyn-core-address" class="form-control dyn-core" value="${data.address||''}"></div>`;
              html += `<div class="form-row"><div class="form-group"><label>Company Phone</label><input type="text" id="dyn-core-companyPhone" class="form-control dyn-core" value="${data.companyPhone||''}"></div><div class="form-group"><label>Website</label><input type="url" id="dyn-core-website" class="form-control dyn-core" value="${data.website||''}"></div></div>`;
          }
          if (grp.id === 'grp_contact') {
              html += `<div class="form-row"><div class="form-group"><label>First Name *</label><input type="text" id="dyn-core-pFirstName" class="form-control dyn-core" value="${data.pFirstName||''}" required></div><div class="form-group"><label>Last Name *</label><input type="text" id="dyn-core-pLastName" class="form-control dyn-core" value="${data.pLastName||''}" required></div></div>`;
              html += `<div class="form-row"><div class="form-group"><label>Email *</label><input type="email" id="dyn-core-pEmail" class="form-control dyn-core" value="${data.pEmail||''}" required></div><div class="form-group"><label>Phone</label><input type="text" id="dyn-core-pPhone" class="form-control dyn-core" value="${data.pPhone||''}"></div></div>`;
          }
          if (grp.id === 'grp_contract') {
              html += `<div class="form-row"><div class="form-group"><label>Start Date *</label><input type="date" id="dyn-core-startDate" class="form-control dyn-core" value="${mode==='add'? (data.startDate||'') : (data.currentStartDate||'')}" required></div><div class="form-group"><label>Rate ($)</label><input type="number" id="dyn-core-rate" class="form-control dyn-core" value="${data.rate||''}"></div></div>`;
              html += `<div class="form-row"><div class="form-group"><label>Term Unit</label><select id="dyn-core-termUnit" class="form-control dyn-core" onchange="handleTermUnitChange(this)"><option value="Days" ${data.termUnit==='Days'?'selected':''}>Days</option><option value="Weeks" ${data.termUnit==='Weeks'?'selected':''}>Weeks</option><option value="Months" ${data.termUnit==='Months'?'selected':''}>Months</option><option value="Years" ${data.termUnit==='Years'?'selected':''}>Years</option><option value="One-time" ${data.termUnit==='One-time'?'selected':''}>One-time</option></select></div><div class="form-group"><label>Term Count</label><input type="number" id="dyn-core-termCount" class="form-control dyn-core" value="${data.termCount||'1'}"></div></div>`;
              var sbox = GLOBAL_SERVICES.filter(s=>s.status==='Active').map(s => `<label><input type="checkbox" class="dyn-srv-cb" value="${s.name}" ${srvArr.includes(s.name)?'checked':''}> ${s.name}</label>`).join('');
              html += `<div class="form-group"><label>Services Included</label><div class="checkbox-group" id="dyn-core-services" style="display:flex; gap:15px;">${sbox||'No services defined'}</div></div>`;
          }
          if (grp.id === 'grp_add_contact') {
              var contactSfDef = btoa(unescape(encodeURIComponent(JSON.stringify([{label: 'First Name', type: 'text'}, {label: 'Last Name', type: 'text'}, {label: 'Email', type: 'text'}]))));
              html += `<div id="dyn-add-contacts-container"></div><button type="button" class="btn-add-row" onclick="addRepeaterRow('dyn-add-contacts-container', '${contactSfDef}')">+ Add Contact</button>`;
          }

          var cFields = CLIENTS_CONFIG.customFields.filter(f => f.groupId === grp.id);
          cFields.forEach(f => {
              var val = addl[f.id] !== undefined ? addl[f.id] : '';
              html += `<div class="form-group"><label>${f.label}${f.required?' *':''}</label>`;
              if (f.type === 'select') { var o=(f.options||"").split(','); html += `<select id="dyn-cf-${f.id}" class="form-control dyn-cf" data-id="${f.id}" data-type="select"><option value="">Select...</option>${o.map(x=>`<option value="${x.trim()}" ${val===x.trim()?'selected':''}>${x.trim()}</option>`).join('')}</select>`; }
              else if (f.type === 'textarea') { html += `<textarea id="dyn-cf-${f.id}" class="form-control dyn-cf" data-id="${f.id}" data-type="textarea" style="height:80px;">${val}</textarea>`; }
              else if (f.type === 'richtext') { html += `<div id="editor-${f.id}" style="min-height:120px;">${val}</div><input type="hidden" id="dyn-cf-${f.id}" class="dyn-cf" data-id="${f.id}" data-type="richtext">`; }
              else if (f.type === 'json') { 
                  var encodedOptions = btoa(unescape(encodeURIComponent(f.options || "[]")));
                  html += `<div id="json-rep-${f.id}" class="dyn-cf" data-id="${f.id}" data-type="json"></div><button type="button" class="btn-add-row" onclick="addRepeaterRow('json-rep-${f.id}', '${encodedOptions}')">+ Add Item</button>`; 
              }
              else { html += `<input type="${f.type}" id="dyn-cf-${f.id}" class="form-control dyn-cf" data-id="${f.id}" data-type="${f.type}" value="${val}" ${f.required?'required':''}>`; }
              html += `</div>`;
          });
          html += `</div>`; target.innerHTML += html;
      });

      // Post-Render Init
      CLIENTS_CONFIG.customFields.filter(f=>f.type==='richtext').forEach(f => { ACTIVE_QUILLS[f.id] = new Quill('#editor-'+f.id, { theme: 'snow' }); });
      
      // Initialize One-Time logic state
      var tu = document.getElementById('dyn-core-termUnit'); if(tu) handleTermUnitChange(tu);

      var defaultContactsDef = btoa(unescape(encodeURIComponent(JSON.stringify([{label: 'First Name', type: 'text'}, {label: 'Last Name', type: 'text'}, {label: 'Email', type: 'text'}]))));
      if(mode==='edit') {
         try { var arrC = JSON.parse(data.addContacts||"[]"); if(arrC.length > 0) arrC.forEach(c => addRepeaterRow('dyn-add-contacts-container', defaultContactsDef, c)); else addRepeaterRow('dyn-add-contacts-container', defaultContactsDef); } catch(e){}
         CLIENTS_CONFIG.customFields.filter(f=>f.type==='json').forEach(f => { 
             var encodedOptions = btoa(unescape(encodeURIComponent(f.options || "[]")));
             try { var arrJ = JSON.parse(addl[f.id]||"[]"); if(arrJ.length > 0) arrJ.forEach(obj => addRepeaterRow('json-rep-'+f.id, encodedOptions, obj)); else addRepeaterRow('json-rep-'+f.id, encodedOptions); } catch(e) { addRepeaterRow('json-rep-'+f.id, encodedOptions); } 
         });
      } else { 
         addRepeaterRow('dyn-add-contacts-container', defaultContactsDef); 
         CLIENTS_CONFIG.customFields.filter(f=>f.type==='json').forEach(f => { addRepeaterRow('json-rep-'+f.id, btoa(unescape(encodeURIComponent(f.options || "[]")))); });
      }
  }

  function addRepeaterRow(containerId, encodedSfDef, existingObj = {}) {
      var c = document.getElementById(containerId); if(!c) return;
      var subfields = []; try { subfields = JSON.parse(decodeURIComponent(escape(atob(encodedSfDef)))); } catch(e){}
      if(subfields.length === 0) return;

      var row = document.createElement('div'); row.className = 'dynamic-json-row';
      var inputs = subfields.map(sf => {
          var safeK = sf.label.replace(/[^a-zA-Z0-9]/g,'_');
          var val = existingObj[safeK] !== undefined ? existingObj[safeK] : '';
          var inputHtml = '';
          if(sf.type === 'select') { var opts = (sf.options||'').split(',').map(o=>`<option value="${o.trim()}" ${val===o.trim()?'selected':''}>${o.trim()}</option>`).join(''); inputHtml = `<select class="form-control rep-input" data-key="${safeK}"><option value="">Select...</option>${opts}</select>`; } 
          else if (sf.type === 'textarea') { inputHtml = `<textarea class="form-control rep-input" data-key="${safeK}" style="height:40px;">${val}</textarea>`; } 
          else if (sf.type === 'checkbox') { inputHtml = `<select class="form-control rep-input" data-key="${safeK}"><option value="false" ${val==='false'?'selected':''}>No</option><option value="true" ${val==='true'?'selected':''}>Yes</option></select>`; } 
          else { inputHtml = `<input type="${sf.type}" class="form-control rep-input" data-key="${safeK}" value="${val}">`; }
          return `<div class="form-group"><label>${sf.label}</label>${inputHtml}</div>`;
      }).join('');
      row.innerHTML = `<button type="button" class="row-remove-btn" onclick="this.parentElement.remove()">&times;</button><div style="display:grid; grid-template-columns: repeat(${subfields.length}, 1fr); gap:15px;">${inputs}</div>`;
      c.appendChild(row);
  }

  function handleDynamicSubmit(e) {
      e.preventDefault(); var btn = document.getElementById('dyn-submit-btn'); btn.disabled = true; btn.innerText = "Processing...";
      var mode = document.getElementById('dyn-mode').value;
      
      var payload = { 
          rowIndex: document.getElementById('dyn-rowIndex').value, companyName: document.getElementById('dyn-core-companyName').value, 
          address: document.getElementById('dyn-core-address').value, companyPhone: document.getElementById('dyn-core-companyPhone').value, website: document.getElementById('dyn-core-website').value, 
          pFirstName: document.getElementById('dyn-core-pFirstName').value, pLastName: document.getElementById('dyn-core-pLastName').value, pEmail: document.getElementById('dyn-core-pEmail').value, pPhone: document.getElementById('dyn-core-pPhone').value, 
          startDate: document.getElementById('dyn-core-startDate').value, currentStartDate: document.getElementById('dyn-core-startDate').value, 
          rate: document.getElementById('dyn-core-rate').value, termUnit: document.getElementById('dyn-core-termUnit').value, termCount: document.getElementById('dyn-core-termCount').value, 
          status: document.getElementById('dyn-core-status').value 
      };
      payload.services = Array.from(document.querySelectorAll('.dyn-srv-cb:checked')).map(cb=>cb.value).join(', ');
      
      var addC = []; document.querySelectorAll('#dyn-add-contacts-container .dynamic-json-row').forEach(r => { addC.push({ firstName: r.querySelector('[data-key="First_Name"]').value, lastName: r.querySelector('[data-key="Last_Name"]').value, email: r.querySelector('[data-key="Email"]').value }); });
      payload.addContacts = JSON.stringify(addC);

      var addl = {};
      document.querySelectorAll('.dyn-cf').forEach(el => {
          var id = el.dataset.id; var type = el.dataset.type;
          if (type === 'richtext') { addl[id] = ACTIVE_QUILLS[id].root.innerHTML; }
          else if (type === 'json') { 
              var arr = []; el.querySelectorAll('.dynamic-json-row').forEach(r => { var obj={}; r.querySelectorAll('.rep-input').forEach(i => obj[i.dataset.key] = i.value); arr.push(obj); });
              addl[id] = JSON.stringify(arr);
          } else { addl[id] = el.value; }
      });
      payload.addlFields = JSON.stringify(addl);

      var action = mode === 'add' ? createClientRecord : updateClientRecord;
      google.script.run.withSuccessHandler(res => { btn.disabled=false; btn.innerText="Save Profile"; if(res.success){ loadClientsTable(); switchView('clientListView'); if(typeof showSystemModal==='function') showSystemModal("Success", "Profile saved."); } else { if(typeof showSystemModal==='function') showSystemModal("Error", res.error); else alert(res.error); } })(payload);
  }

  function openServiceForm(rowIndex = null) { document.getElementById('srvForm').reset(); document.getElementById('srv-rowIndex').value = rowIndex||''; if(rowIndex){ var s=GLOBAL_SERVICES.find(x=>x.rowIndex==rowIndex); if(s){ document.getElementById('srv-name').value=s.name; document.getElementById('srv-desc').value=s.description; document.getElementById('srv-status').value=s.status; } } document.getElementById('srvFormTitle').innerText = rowIndex ? "Edit Service Definition" : "Define New Service"; switchView('serviceFormView'); }
  function handleServiceSubmit(e) { e.preventDefault(); var payload = { rowIndex: document.getElementById('srv-rowIndex').value, name: document.getElementById('srv-name').value, description: document.getElementById('srv-desc').value, status: document.getElementById('srv-status').value }; google.script.run.withSuccessHandler(res => { if(res.success){ loadServicesTable(); switchView('clientListView'); switchClientMasterTab('services'); } }).saveServiceRecord(payload); }
  function toggleAccordion(el) { el.classList.toggle("active"); var p=el.nextElementSibling; p.style.display=(p.style.display==="block")?"none":"block"; }
</script>
