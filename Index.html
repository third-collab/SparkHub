<!DOCTYPE html>
<html>

  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

      --brand-dark: <?= themeDark ?> !important;
      --brand-bg: <?= themeBg ?> !important;

<body>

  <? if (typeof isInstalled !== 'undefined' && !isInstalled) { ?>
  <div class="system-overlay" id="installWizard">
    <div class="overlay-card">
      <div id="wizardContent">
        <img src="<?= typeof appFallbackLogo !== 'undefined' ? appFallbackLogo : '' ?>" style="width: 60px; height: 60px; margin: 0 auto 20px; display: block;" alt="Setup Logo">
        <h1>Welcome to SparkHub</h1>
        <p>Please provide the root folder ID to initialize your core system files.</p>
        <form id="installForm" onsubmit="handleInstallSubmit(event)">
          <div class="form-group" style="text-align: left;"><label>Root Folder ID *</label><input type="text" id="ins-root-id" class="form-control" required placeholder="Enter Folder ID"></div>
          <div class="form-group" style="text-align: left; margin-top: 15px;"><label>System Name</label><input type="text" id="ins-sys-name" class="form-control" required placeholder="e.g., Acme Corp Hub"></div>
          <button type="submit" class="btn-primary" style="width: 100%; margin-top: 30px;">Run Installation</button>
        </form>
      </div>
      <div id="wizardLoading" class="overlay-loading"><div class="spinner-core"></div><h2>Installing System...</h2></div>
      <div id="wizardSuccess" style="display: none;"><div style="color: green; font-size: 50px; margin-bottom: 20px;">✓</div><h2>Success!</h2></div>
    </div>
  </div>
  <? } ?>

  <div class="header">
    <div class="header-logo" onclick="switchView('dashboardView')" style="cursor: pointer;" title="Back to Dashboard">
      <img id="hub-system-logo" src="<?= typeof systemLogoUrl !== 'undefined' && systemLogoUrl ? systemLogoUrl : appFallbackLogo ?>" alt="System Logo" style="height: 40px; margin-right: 15px; object-fit: contain;">
      <h1 id="hub-system-name"><?= typeof systemName !== 'undefined' && systemName ? systemName : 'SparkHub' ?></h1>
    </div>
    <div class="header-right">
      <? if (installedPlugins.indexOf('UserBar') !== -1) { ?>
        <div class="header-user-pill" onclick="event.stopPropagation(); togglePopup('user-popup')">Welcome, <span id="display-firstname"></span></div>
      <? } ?>
      <div class="header-tools"></div>
    </div>
  </div>

  <div id="dashboardView" class="container">
    <h2 style="margin-bottom: 20px; color: var(--brand-dark);">Welcome, select a module:</h2>

    <h3 class="module-group-title" id="title-core" style="display: none;">System Administration</h3>
    <div class="card-grid" id="grid-core"></div>

    <h3 class="module-group-title" id="title-operational" style="display: none;">Business Operations</h3>
    <div class="card-grid" id="grid-operational"></div>

    <h3 class="module-group-title" id="title-internal" style="display: none;">Internal Operations</h3>
    <div class="card-grid" id="grid-internal"></div>
  </div>

  <div id="globalAlertModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px); z-index: 100000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; transition: all 0.3s ease;">
    <div style="background: white; padding: 35px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; border-top: 5px solid var(--brand-primary);">
      <h2 id="globalAlertTitle" style="margin-top: 0; color: var(--brand-dark); font-size: 22px;"></h2>
      <p id="globalAlertMsg" style="font-size: 15px; color: #475569; margin-bottom: 30px; white-space: pre-wrap; line-height: 1.6;"></p>
      <button class="btn-primary" onclick="document.getElementById('globalAlertModal').style.display='none'" style="width: 100%; padding: 12px; font-weight: bold; border-radius: 8px;">Acknowledge</button>
    </div>
  </div>

  <? includeList.forEach(function(fileName) { ?>
    <? try { ?>
      <?!= include(fileName); ?>
    <? } catch(e) { ?>
      <? } ?>
  <? }); ?>

  <script>
    /* --- CORE SYSTEM SCRIPTS --- */
    var CURRENT_USER_ROLE = "<?= typeof userRole !== 'undefined' ? userRole : '' ?>";
    var CURRENT_USERNAME = "<?= typeof username !== 'undefined' ? username : 'System' ?>";
    var CURRENT_USER_FIRSTNAME = "<?= typeof userFirstName !== 'undefined' ? userFirstName : 'User' ?>";
    var SYSTEM_AUTH_MODE = "<?= typeof authMode !== 'undefined' ? authMode : 'SSO' ?>";
    var INSTALLED_MODULES = "<?= typeof installedModules !== 'undefined' ? installedModules : '' ?>";
    var INSTALLED_PLUGINS = "<?= typeof installedPlugins !== 'undefined' ? installedPlugins : '' ?>";
    var CURRENT_USER_PERMISSIONS = <?!= typeof userPermissions !== 'undefined' && userPermissions ? userPermissions : '{}' ?>;
    
    // NEW: Captures the resolved Dashboard Config from the backend
    var DASHBOARD_LAYOUT = <?!= JSON.stringify(typeof dashboardLayout !== 'undefined' ? dashboardLayout : 'DEFAULT') ?>;

    // EXPOSE UI CONFIGURATIONS
    var SYSTEM_LOGO_URL = "<?= typeof systemLogoUrl !== 'undefined' ? systemLogoUrl : '' ?>";
    var APP_FALLBACK_LOGO = "<?= typeof appFallbackLogo !== 'undefined' ? appFallbackLogo : '' ?>";
    var RESET_TOKEN = "<?= typeof resetToken !== 'undefined' ? resetToken : '' ?>";

    // ----------------------------------------------------------------
    // ROLE-BASED ACCESS CONTROL (RBAC) ENGINE
    // ----------------------------------------------------------------
    function hasPermission(category, action) {
      if (CURRENT_USER_PERMISSIONS["ALL"]) return true; // Master Admin wildcard
      if (!CURRENT_USER_PERMISSIONS[category]) return false; // Missing category
      return CURRENT_USER_PERMISSIONS[category].includes(action); // Check specific action
    }

    function enforceUIPermissions() {
      document.querySelectorAll('.perm-protected').forEach(el => {
        var reqCat = el.getAttribute('data-perm-category');
        var reqAct = el.getAttribute('data-perm-action');
        if (reqCat && reqAct && !hasPermission(reqCat, reqAct)) {
          el.style.display = 'none';
        }
      });
    }

    // ----------------------------------------------------------------
    // DYNAMIC CARD INJECTION ENGINE
    // ----------------------------------------------------------------
    // ----------------------------------------------------------------
    // DYNAMIC WIDGET INJECTION ENGINE
    // ----------------------------------------------------------------
    function injectDashboardCards() {
      var templates = Array.from(document.querySelectorAll('.module-card-template'));
      var isDefault = (DASHBOARD_LAYOUT === 'DEFAULT');
      var layoutMap = [];
      
      if (!isDefault) {
        try { layoutMap = typeof DASHBOARD_LAYOUT === 'string' ? JSON.parse(DASHBOARD_LAYOUT) : DASHBOARD_LAYOUT; } 
        catch(e) { isDefault = true; }
      }

      if (isDefault) {
        // STANDARD LOAD (Fallback: Loads all permitted cards at span-2)
        templates.forEach(tpl => {
          var reqCat = tpl.getAttribute('data-perm-category');
          var reqAct = tpl.getAttribute('data-perm-action');
          if (reqCat && reqAct && !hasPermission(reqCat, reqAct)) return;

          var category = tpl.getAttribute('data-category'); 
          var grid = document.getElementById('grid-' + category);
          var title = document.getElementById('title-' + category);

          if (grid && !document.getElementById(tpl.content.firstElementChild.id)) {
            var newCard = tpl.content.cloneNode(true);
            newCard.firstElementChild.classList.add('span-2');
            grid.appendChild(newCard);
            if (title) title.style.display = 'block';
          }
        });
      } else {
        // CUSTOM WIDGET CONFIG LOAD (e.g., [{id: 'card-users', span: 4}, ...])
        layoutMap.forEach(widget => {
          var tpl = templates.find(t => t.content.firstElementChild.id === widget.id);
          if (!tpl) return; // Ignores uninstalled/deleted widgets
          
          var reqCat = tpl.getAttribute('data-perm-category');
          var reqAct = tpl.getAttribute('data-perm-action');
          if (reqCat && reqAct && !hasPermission(reqCat, reqAct)) return; // Security First

          var category = widget.category || tpl.getAttribute('data-category'); 
          var grid = document.getElementById('grid-' + category);
          var title = document.getElementById('title-' + category);

          if (grid && !document.getElementById(widget.id)) {
            var newCard = tpl.content.cloneNode(true);
            newCard.firstElementChild.classList.add('span-' + (widget.span || 2));
            grid.appendChild(newCard);
            if (title) title.style.display = 'block';
          }
        });
      }
    }

    // ----------------------------------------------------------------
    // APP INITIALIZER
    // ----------------------------------------------------------------
    function bootApplication() {
      if (typeof initUserBarPlugin === 'function') initUserBarPlugin();
      injectDashboardCards();
      enforceUIPermissions();

      if (CURRENT_USER_ROLE !== 'Inactive' && CURRENT_USER_ROLE !== 'Guest' && CURRENT_USER_ROLE !== '') {
        google.script.run.updateLastLogin();
      }
    }
    
    document.addEventListener("DOMContentLoaded", function() {
      if (document.getElementById('installWizard')) return;

      // 1. Inject logos into ALL overlay screens immediately
      var loginLogo = document.getElementById('login-logo-img');
      if (loginLogo) loginLogo.src = SYSTEM_LOGO_URL || APP_FALLBACK_LOGO;
      
      var resetLogo = document.getElementById('reset-logo-img');
      if (resetLogo) resetLogo.src = SYSTEM_LOGO_URL || APP_FALLBACK_LOGO;

      // 2. Intercept the boot sequence if a reset token is present in the URL
      if (typeof RESET_TOKEN !== 'undefined' && RESET_TOKEN !== "") {
        var resetScreen = document.getElementById('resetScreen');
        if (resetScreen) resetScreen.style.display = 'flex';
        return; // Halt the normal login process to force the password reset flow
      }

      // 3. Normal Boot Sequence
      if (checkLocalSession()) {
         bootApplication(); // User is verified (SSO or Local)
      } else {
         var loginScreen = document.getElementById('loginScreen');
         if (loginScreen) loginScreen.style.display = 'flex'; // Trap them at Login
      }
    });

    // ----------------------------------------------------------------
    // INSTALLATION WIZARD & UI NAVIGATION
    // ----------------------------------------------------------------
    function handleInstallSubmit(e) {
      if (e) e.preventDefault();
      
      var sysNameInput = document.getElementById('ins-sys-name').value.trim();
      
      if (sysNameInput.toLowerCase() === 'sparkhub') {
        alert("Please choose a unique system name for your organization. 'SparkHub' is reserved.");
        return;
      }
      
      var data = { 
        rootId: document.getElementById('ins-root-id').value, 
        sysName: sysNameInput 
      };
      
      document.getElementById('wizardContent').style.display = 'none';
      document.getElementById('wizardLoading').style.display = 'flex';
      
      google.script.run.withSuccessHandler(function(res) {
        if (res.includes("Success")) {
          document.getElementById('wizardLoading').style.display = 'none';
          document.getElementById('wizardSuccess').style.display = 'block';
          
          setTimeout(() => { 
            var wizard = document.getElementById('installWizard');
            if (wizard) wizard.style.display = 'none';
            
            document.getElementById('hub-system-name').innerText = sysNameInput;
            document.getElementById('hub-window-title').innerText = sysNameInput;
            
            // Re-hydrate permissions as Admin for the post-install view
            CURRENT_USER_PERMISSIONS = {"ALL":["ALL"]};
            bootApplication();
            
            switchView('dashboardView');
          }, 2000); 
        } else { 
          alert("Installation Error: " + res); 
          document.getElementById('wizardContent').style.display = 'block';
          document.getElementById('wizardLoading').style.display = 'none';
        }
      }).performUiInstallation(data);
    }

    function switchView(viewId) {
      document.querySelectorAll('.container').forEach(el => el.style.display = 'none');
      var target = document.getElementById(viewId);
      if (target) target.style.display = 'block';

      if (viewId === 'usersListView' && typeof loadUsersTable === "function") loadUsersTable();
      if (viewId === 'templatesListView' && typeof loadTemplatesTable === "function") loadTemplatesTable();
    }
    
    function showSystemModal(title, message) {
      var m = document.getElementById('globalAlertModal');
      if (m) {
        document.getElementById('globalAlertTitle').innerText = title;
        document.getElementById('globalAlertMsg').innerText = message;
        m.style.display = 'flex';
      }
    }

    function toggleFilter(id) {
      var el = document.getElementById(id); if (el) { el.classList.toggle('active'); el.style.display = el.classList.contains('active') ? 'flex' : 'none'; }
    }

    function toggleDropdown(id) {
      var d = document.getElementById(id);
      document.querySelectorAll('.dropdown-content').forEach(c => { if(c.id !== id) c.classList.remove('show'); });
      if (d) d.classList.toggle('show');
    }

    function togglePopup(id) {
      var p = document.getElementById(id); if (!p) return;
      var isOpen = (p.style.display === 'block');
      document.querySelectorAll('.header-popup').forEach(el => el.style.display = 'none');
      if (!isOpen) p.style.display = 'block';
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.header-popup') && !e.target.closest('.header-tools') && !e.target.closest('.header-user-pill') && !e.target.closest('.custom-dropdown')) {
        document.querySelectorAll('.header-popup').forEach(p => p.style.display = 'none');
        document.querySelectorAll('.dropdown-content').forEach(c => c.classList.remove('show'));
      }
    });
  </script>
</body>
</html>
