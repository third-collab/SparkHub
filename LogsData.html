<template class="module-card-template" data-category="core" data-perm-category="System Logs" data-perm-action="View Logs">
  <div class="card" id="card-logs" onclick="initLogsModule();">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    <h3>System Logs</h3>
    <p>Audit system actions and monitor events.</p>
  </div>
</template>

<template id="tpl-settings-logs-ro">
  <div style="margin-top: 25px; font-size: 14px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px; border-bottom: 2px solid #E3E3E3; padding-bottom: 20px;">
      <h2 class="settings-section-header" style="margin:0;">System Logs Configuration</h2>
      <button class="btn-primary perm-protected" onclick="toggleModuleEdit('logs', true)" data-perm-category="Logs" data-perm-action="View Logs">Edit Logs Settings</button>
    </div>
    
    <div style="margin-top: 20px;">
      <p><strong>Logs Registry ID:</strong><br><code id="ro-settings-logsid" style="font-size:11px;"></code></p>
      <p><strong>Log Retention:</strong> <span id="ro-settings-retention-txt" style="color:var(--brand-primary); font-weight:700;">Loading...</span></p>
      <p><strong>Audit Level:</strong> <span style="color:var(--brand-primary); font-weight:700;">Full System Broadcast</span></p>
    </div>
  </div>
</template>

<template id="tpl-settings-logs-edt">
  <div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; border-bottom: 2px solid #E3E3E3; padding-bottom: 20px;">
      <h2 style="margin:0;">Edit Logs Settings</h2>
      <button type="button" class="btn-cancel" onclick="toggleModuleEdit('logs', false)">Cancel</button>
    </div>
  
    <div class="form-group" style="margin-bottom: 20px; margin-top: 25px;">
      <label>Logs DB Registry ID *</label>
      <input type="text" id="edt-settings-logsid" class="form-control" placeholder="Spreadsheet ID">
    </div>

    <div class="form-row" style="margin-top:25px;">
      <div class="form-group">
        <label>Retention Policy</label>
        <select id="edt-settings-retention" class="form-control">
          <option value="30">1 Month</option>
          <option value="90">3 Months (Default)</option>
          <option value="180">6 Months</option>
          <option value="365">1 Year</option>
          <option value="0">Indefinite (No Purge)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Minimum Severity</label>
        <select class="form-control" disabled>
          <option>INFO (Standard)</option>
        </select>
      </div>
    </div>
    
    <div style="margin-top: 30px; text-align: right;">
      <button type="button" class="btn-primary" onclick="handleSaveLogsConfig(event)">Save Logs Settings</button>
    </div>
  </div>
</template>

<div id="logsListView" class="container" style="display: none;">
  <button class="btn-dash-back" onclick="switchView('dashboardView')">&#8592; Back to Dashboard</button>
  
  <div class="view-header-bar">
    <h2 style="margin: 0; color: var(--brand-dark);">System Audit Trail</h2>
  </div>

  <div class="filter-wrapper">
    <input type="text" id="log-filter-search" class="filter-input" placeholder="Search by details, user, or entity..." onkeyup="applyLogFilters()">
    <button type="button" class="btn-filter-toggle" onclick="toggleFilter('log-adv')">Filters</button>
    <div id="log-adv" class="filter-advanced">
      <div class="custom-dropdown">
        <button class="dropdown-btn" onclick="toggleDropdown('log-module-drop')">Module ▼</button>
        <div class="dropdown-content" id="log-module-drop">
          </div>
      </div>
      <button type="button" class="btn-reset-filters" onclick="resetLogFilters()">Reset</button>
    </div>
    <button type="button" class="btn-filter-toggle" id="btn-logs-refresh" style="margin-left: auto;" onclick="loadLogsTable()">Refresh</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Module</th>
          <th>Action</th>
          <th>User</th>
          <th>Entity</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <tr><td colspan="6" style="text-align:center; padding: 30px;">Synchronizing logs...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  /* ========================================================================
     1. GLOBAL STATE
     ======================================================================== */
  var GLOBAL_LOGS_DATA = [];

  /* ========================================================================
     2. BOOTSTRAPPERS
     ======================================================================== */
  function initLogsModule() {
    switchView('logsListView');
    loadLogsTable();
  }

  /* ========================================================================
     3. DATA LOADERS
     ======================================================================== */
  function loadLogsTable() {
    var tbody = document.getElementById('logTableBody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px; color:#64748b;">Synchronizing logs...</td></tr>';
    
    // Engages standard frontend interaction blockers during server round-trips
    var refreshBtn = document.getElementById('btn-logs-refresh');
    if (refreshBtn) { refreshBtn.disabled = true; refreshBtn.innerText = 'Refreshing...'; }

    google.script.run
      .withFailureHandler(function(err) {
        if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.innerText = 'Refresh'; }
        if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 30px; color:#ef4444; font-weight:600;">Failed to synchronize logs: ${err.message}</td></tr>`;
      })
      .withSuccessHandler(function(logs) {
        if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.innerText = 'Refresh'; }
        GLOBAL_LOGS_DATA = logs || [];
        
        // Dynamically extract all unique modules from the database
        var modDrop = document.getElementById('log-module-drop');
        if (modDrop) {
          // Track currently checked filters to preserve them across reloads
          var currentlyChecked = Array.from(document.querySelectorAll('.log-filter-mod-cb:checked')).map(cb => cb.value);
          var isFirstLoad = modDrop.innerHTML.trim() === "";

          var uniqueMods = [];
          GLOBAL_LOGS_DATA.forEach(function(l) {
            if (l.module && uniqueMods.indexOf(l.module) === -1) uniqueMods.push(l.module);
          });
          
          // Build the checkboxes automatically
          var html = '';
          uniqueMods.sort().forEach(function(m) {
            var isChecked = isFirstLoad || currentlyChecked.includes(m) ? 'checked' : '';
            html += '<label><input type="checkbox" class="log-filter-mod-cb" value="' + m + '" ' + isChecked + ' onchange="applyLogFilters()"> ' + m + '</label>';
          });
          modDrop.innerHTML = html;
        }
      
        applyLogFilters();
      }).getLogsList();
  }

  /* ========================================================================
     4. DATA MANIPULATION
     ======================================================================== */
  function applyLogFilters() {
    var search = document.getElementById('log-filter-search').value.toLowerCase();
    var checkedMods = Array.from(document.querySelectorAll('.log-filter-mod-cb:checked')).map(cb => cb.value);

    var filtered = GLOBAL_LOGS_DATA.filter(function(l) {
      var matchesSearch = l.details.toLowerCase().includes(search) || l.actor.toLowerCase().includes(search) || l.entity.toLowerCase().includes(search);
      var matchesMod = checkedMods.length === 0 || checkedMods.includes(l.module);
      return matchesSearch && matchesMod;
    });

    renderLogTableRows(filtered);
  }

  function resetLogFilters() {
    document.getElementById('log-filter-search').value = '';
    document.querySelectorAll('.log-filter-mod-cb').forEach(cb => cb.checked = true);
    applyLogFilters();
  }
  
  function populateLogsSettings(configs) {
    // Populate Read-Only View
    const roId = document.getElementById('ro-settings-logsid');
    const roRet = document.getElementById('ro-settings-retention-txt');
    
    // Now matches the camelCase from Settings.gs
    if (roId) roId.innerText = configs.logsDbId || 'Not Set'; 
    if (roRet) {
      const days = configs.logsRetentionDays || "90"; 
      roRet.innerText = days === "0" ? "Indefinite" : days + " Days";
    }

    // Populate Edit View
    const edtId = document.getElementById('edt-settings-logsid');
    const edtRet = document.getElementById('edt-settings-retention');
    
    if (edtId) edtId.value = configs.logsDbId || '';
    if (edtRet) edtRet.value = configs.logsRetentionDays || "90";
  }

  /* ========================================================================
     5. RENDERERS
     ======================================================================== */
  function renderLogTableRows(logs) {
    var tbody = document.getElementById('logTableBody');
    tbody.innerHTML = '';
    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">No logs found.</td></tr>';
      return;
    }
    logs.forEach(function(l) {
      tbody.innerHTML += `
        <tr>
          <td><small style="color:#64748b;">${l.timestamp}</small></td>
          <td><span class="badge" style="background:#f1f5f9; color:#475569;">${l.module}</span></td>
          <td><strong>${l.name}</strong></td>
          <td>${l.actor}</td>
          <td>${l.entity}</td>
          <td><span style="font-size:13px; color:#475569;">${l.details}</span></td>
        </tr>
      `;
    });
  }

  /* ========================================================================
     6. VIEW ROUTERS & FORM OPENERS
     ======================================================================== */
  // N/A

  /* ========================================================================
     7. SUBMIT HANDLERS
     ======================================================================== */

  function handleSaveLogsConfig(e) {
    if (e) e.preventDefault();
    
    const payload = {
      logsDbId: document.getElementById('edt-settings-logsid').value,
      retentionDays: document.getElementById('edt-settings-retention').value
    };
    
    // Optional: disable button to prevent double-clicks
    const btn = e.target;
    const originalText = btn.innerText;
    btn.innerText = "Saving...";
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.error) {
          btn.innerText = originalText; btn.disabled = false;
          showSystemModal("Configuration Error", res.error);
          return;
        }
        google.script.run.withSuccessHandler(function(url) {
          window.top.location.href = url;
        }).getAppUrl();
      })
      .withFailureHandler(function(err) {
        btn.innerText = originalText;
        btn.disabled = false;
        alert("Server Error: " + err.message);
      })
      .saveLogsModuleConfig(payload);
  }

  /* ========================================================================
     8. UI HELPERS
     ======================================================================== */
  // N/A
</script>
<!-- [SPARKHUB INTEGRITY ANCHOR: END] -->
